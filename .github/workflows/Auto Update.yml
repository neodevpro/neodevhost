name: Auto Update

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without publishing (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 1000 keeps the unknown/timeout rate low while still finishing a 250k
      # domain sweep in well under the job timeout; raise to 2000 if needed.
      CHECK_CONCURRENCY: 1000
      CHECK_STRICT_RESOLVERS: "1"
      CHECK_MIN_OVERSEAS: "2"
      CHECK_MIN_CHINA: "2"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq idn2 || echo "idn2 unavailable, unicode domains will be skipped"

      - name: Install sing-box (for the .srs rule-set)
        run: |
          curl -fsSL --retry 3 -o /tmp/sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sing-box-1.14.4-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Install python deps (dead-domain check)
        run: python3 -m pip install --quiet --upgrade dnspython aiohttp

      - name: Lint shell scripts
        run: shellcheck -x -s bash host.sh install.sh uninstall.sh tests/run.sh tests/audit.sh

      - name: Run stage tests
        run: bash tests/run.sh

      - name: Build lists
        run: |
          # Bulk DNS lookups hold one socket per worker.
          ulimit -n 65536 || true
          bash ./host.sh ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### neodevhost build"
            echo ""
            echo "| list | domains |"
            echo "| --- | ---: |"
            echo "| block | $(wc -l < block) |"
            echo "| allow | $(wc -l < allow) |"
            echo "| deadblock | $(wc -l < deadblock) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Git Auto Commit
        if: ${{ !inputs.dry_run }}
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: Auto Update
          commit_options: '--signoff'
          commit_user_name: FusionPlmH
          commit_user_email: leemenhin@gmail.com
          skip_dirty_check: false